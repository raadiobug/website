---
commit-msg:
  commands:
    lint commit message:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      run: pnpm exec prettier --check --config .prettierrc.json {staged_files}
      glob:
        - '*.html'
        - '*.css'
        - '*.js'
        - '*.cjs'
        - '*.mjs'
        - '*.jsx'
        - '*.ts'
        - '*.tsx'
        - '*.astro'
        - '*.mdx'
        - '*.json'
        - '*.md'
        - '*.yml'
        - '*.yaml'
    - name: astro check
      run: pnpm exec astro check
      glob:
        - '*.astro'
        - '*.ts'
        - '*.tsx'
